# pi-secrets example configuration
#
# Copy this file to ~/.pi/agent/secrets.yml (global) or <cwd>/secrets.yml (project).
# Project entries override globals that have the same `content`.
#
# Every entry is validated individually: an invalid entry is skipped with a
# warning, the rest still load.

# 1. Plain obfuscation: exact string -> reversible hash.
#    The model sees $$CLI_TOKEN_XXXX:CC$$; your terminal reveals the real value;
#    exports keep the hash.
- type: plain
  content: "my-super-secret-label"
  mode: obfuscate
  friendlyName: COOL_LABEL

# 2. Regex obfuscation: pattern match -> reversible hash.
#    `flags` is optional; "i" makes the match case-insensitive.
- type: regex
  content: "cli_token-[A-Za-z0-9]{20,}"
  flags: "i"
  mode: obfuscate
  friendlyName: CLI_TOKEN

# 3. Plain replace: exact string -> one-way fixed marker.
#    Irreversible: the real value is gone from context and storage forever.
- type: plain
  content: "internal-service-password"
  mode: replace
  replacement: "[REDACTED]"

# 4. Regex replace: pattern -> one-way fixed marker.
#    The replacement replaces the WHOLE match, not a group. Parentheses in the
#    pattern still work for matching, but the replacement is a literal string.
- type: regex
  content: 'db_dsn\s*[:=]\s*[''\"]?[^''\";\\s]+'
  mode: replace
  replacement: "db_dsn=[REDACTED]"

# 5. Omit `mode`: defaults to obfuscate.
- type: plain
  content: "another-plain-secret"

# 6. Omit `replacement` in replace mode: pi-secrets generates a deterministic
#    same-length replacement (stable across sessions, unpredictable without the key).
- type: regex
  content: "token_[A-Za-z0-9]{16,}"
  mode: replace

# Notes
# - Values and matches shorter than 8 chars are ignored in obfuscate mode
#   (avoids redacting ordinary short words). Replace mode handles short values.
# - friendlyName is sanitized (uppercase letters and digits, capped at 32 chars)
#   and omitted if it would expose a configured secret.
# - Keep this file out of version control; see .npmignore and docs/explain.md.